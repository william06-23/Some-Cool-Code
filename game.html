<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人机对战 - 王者荣耀</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a15;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
      user-select: none;
    }
    #gameContainer {
      position: relative;
      width: 900px;
      height: 680px;
    }
    canvas {
      display: block;
      border: 2px solid #3a2a10;
      border-radius: 4px;
    }
    #ui {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: #f0d78c;
      font-size: 13px;
      letter-spacing: 2px;
      pointer-events: none;
    }
    #killFeed {
      position: absolute;
      top: 50px;
      right: 10px;
      color: #fff;
      font-size: 12px;
      pointer-events: none;
    }
    .kill-msg {
      animation: fadeOut 3s forwards;
      margin-bottom: 4px;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="game"></canvas>
    <div id="ui">⚔ 人机对战 · 3v3 ⚔</div>
    <div id="killFeed"></div>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = 900, H = 680;
      canvas.width = W; canvas.height = H;

      // ==================== 常量 ====================
      const RIVER_Y = 340;
      const LANES = [
        { name: '上', x: 200, towers: [{ x: 200, y: 500, team: 'blue' }, { x: 200, y: 180, team: 'red' }] },
        { name: '中', x: 400, towers: [{ x: 400, y: 480, team: 'blue' }, { x: 400, y: 200, team: 'red' }] },
        { name: '下', x: 600, towers: [{ x: 600, y: 500, team: 'blue' }, { x: 600, y: 180, team: 'red' }] }
      ];

      // ==================== 游戏状态 ====================
      let gameOver = false;
      let winner = null;
      let gameTime = 0;
      let minionSpawnTimer = 0;
      const MINION_SPAWN_INTERVAL = 12; // 秒
      let blueKills = 0, redKills = 0;

      // ==================== 实体列表 ====================
      let heroes = [];
      let minions = [];
      let towers = [];
      let crystals = [];
      let effects = [];

      // 玩家引用
      let player = null;

      // 输入
      const keys = {};
      window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
      window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });

      // ==================== 类定义 ====================
      class Entity {
        constructor(x, y, team, hp, maxHp) {
          this.x = x; this.y = y;
          this.team = team; // 'blue' or 'red'
          this.hp = hp; this.maxHp = maxHp;
          this.alive = true;
        }
        takeDamage(dmg, attacker) {
          this.hp -= dmg;
          if (this.hp <= 0) {
            this.hp = 0;
            this.alive = false;
            this.onDeath(attacker);
          }
        }
        onDeath(attacker) {}
        dist(other) {
          const dx = this.x - other.x, dy = this.y - other.y;
          return Math.sqrt(dx * dx + dy * dy);
        }
      }

      class Hero extends Entity {
        constructor(x, y, team, isPlayer, name) {
          super(x, y, team, 2500, 2500);
          this.isPlayer = isPlayer;
          this.name = name;
          this.speed = isPlayer ? 220 : 160;
          this.atkRange = 80;
          this.atkDmg = isPlayer ? 200 : 140;
          this.atkCD = 1.2;
          this.atkTimer = 0;
          this.skillCD = 0;
          this.skillMaxCD = 8;
          this.target = null;
          this.respawnTimer = 0;
          this.respawnTime = 5;
          this.color = team === 'blue' ? (isPlayer ? '#4da6ff' : '#3388cc') : '#e63e3e';
          this.radius = 16;
          this.baseX = x; this.baseY = y; // 出生点
        }

        update(dt) {
          if (!this.alive) {
            this.respawnTimer -= dt;
            if (this.respawnTimer <= 0) this.respawn();
            return;
          }
          this.atkTimer -= dt;
          this.skillCD -= dt;

          if (this.isPlayer) {
            this.updatePlayer(dt);
          } else {
            this.updateAI(dt);
          }
        }

        updatePlayer(dt) {
          let dx = 0, dy = 0;
          if (keys['w'] || keys['arrowup']) dy -= 1;
          if (keys['s'] || keys['arrowdown']) dy += 1;
          if (keys['a'] || keys['arrowleft']) dx -= 1;
          if (keys['d'] || keys['arrowright']) dx += 1;
          if (dx !== 0 || dy !== 0) {
            const len = Math.sqrt(dx * dx + dy * dy);
            this.x += (dx / len) * this.speed * dt;
            this.y += (dy / len) * this.speed * dt;
          }
          this.x = Math.max(20, Math.min(W - 20, this.x));
          this.y = Math.max(20, Math.min(H - 20, this.y));

          // 普攻 (J 或 空格)
          if ((keys['j'] || keys[' ']) && this.atkTimer <= 0) {
            this.autoAttack();
          }
          // 技能 K
          if (keys['k'] && this.skillCD <= 0) {
            this.useSkill();
          }
        }

        updateAI(dt) {
          // 找目标
          this.target = this.findTarget();
          if (this.target && this.dist(this.target) <= this.atkRange) {
            // 在攻击范围内就攻击
            if (this.atkTimer <= 0) this.attackTarget(this.target);
          } else if (this.target) {
            // 走向目标
            const dx = this.target.x - this.x;
            const dy = this.target.y - this.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            this.x += (dx / len) * this.speed * dt;
            this.y += (dy / len) * this.speed * dt;
          } else {
            // 没有目标，沿兵线推进
            this.pushLane(dt);
          }

          // 低血量撤退
          if (this.hp < this.maxHp * 0.25) {
            const base = this.team === 'blue' ? { x: 400, y: 620 } : { x: 400, y: 60 };
            const dx = base.x - this.x, dy = base.y - this.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            this.x += (dx / len) * this.speed * dt;
            this.y += (dy / len) * this.speed * dt;
          }

          // AI 也偶尔放技能
          if (this.skillCD <= 0 && this.target && this.dist(this.target) < 100) {
            this.useSkill();
          }

          this.x = Math.max(20, Math.min(W - 20, this.x));
          this.y = Math.max(20, Math.min(H - 20, this.y));
        }

        pushLane(dt) {
          const midLane = 400;
          const targetY = this.team === 'blue' ? 100 : 580;
          const dx = midLane - this.x, dy = targetY - this.y;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          this.x += (dx / len) * this.speed * dt * 0.5;
          this.y += (dy / len) * this.speed * dt * 0.5;
        }

        findTarget() {
          const enemies = this.team === 'blue'
            ? [...heroes.filter(h => h.team === 'red' && h.alive), ...minions.filter(m => m.team === 'red' && m.alive), ...towers.filter(t => t.team === 'red' && t.alive), ...crystals.filter(c => c.team === 'red' && c.alive)]
            : [...heroes.filter(h => h.team === 'blue' && h.alive), ...minions.filter(m => m.team === 'blue' && m.alive), ...towers.filter(t => t.team === 'blue' && t.alive), ...crystals.filter(c => c.team === 'blue' && c.alive)];

          let best = null, bestDist = 400;
          for (const e of enemies) {
            // 优先英雄
            const priority = e instanceof Hero ? 0 : (e instanceof Tower ? 2 : 1);
            const d = this.dist(e);
            const score = d + priority * 60;
            if (score < bestDist + priority * 60 && d < bestDist + 100) {
              if (!best || score < bestDist) {
                best = e;
                bestDist = d;
              }
            }
          }
          return best;
        }

        autoAttack() {
          const target = this.findTarget();
          if (target && this.dist(target) <= this.atkRange) {
            this.attackTarget(target);
          }
        }

        attackTarget(target) {
          if (this.atkTimer > 0) return;
          this.atkTimer = this.atkCD;
          target.takeDamage(this.atkDmg, this);
          effects.push(new HitEffect(target.x, target.y));
          if (!target.alive) {
            if (target instanceof Hero) {
              if (this.team === 'blue') blueKills++;
              else redKills++;
              addKillMsg(this.name + ' 击败了 ' + target.name);
            } else if (target instanceof Tower) {
              addKillMsg((this.team === 'blue' ? '蓝方' : '红方') + '摧毁了一座防御塔！');
            }
          }
        }

        useSkill() {
          this.skillCD = this.skillMaxCD;
          // AOE 范围伤害
          const sx = this.x, sy = this.y;
          effects.push(new SkillEffect(sx, sy));

          const enemies = this.team === 'blue'
            ? [...heroes.filter(h => h.team === 'red' && h.alive), ...minions.filter(m => m.team === 'red' && m.alive)]
            : [...heroes.filter(h => h.team === 'blue' && h.alive), ...minions.filter(m => m.team === 'blue' && m.alive)];

          for (const e of enemies) {
            if (this.dist(e) <= 120) {
              e.takeDamage(350, this);
              if (!e.alive && e instanceof Hero) {
                if (this.team === 'blue') blueKills++;
                else redKills++;
                addKillMsg(this.name + ' 击败了 ' + e.name);
              }
            }
          }
        }

        onDeath(attacker) {
          this.respawnTimer = this.respawnTime;
          this.target = null;
        }

        respawn() {
          this.x = this.baseX;
          this.y = this.baseY;
          this.hp = this.maxHp;
          this.alive = true;
          this.atkTimer = 0;
          this.skillCD = 0;
        }
      }

      class Minion extends Entity {
        constructor(x, y, team, laneX) {
          super(x, y, team, 600, 600);
          this.speed = 100;
          this.atkRange = 50;
          this.atkDmg = 70;
          this.atkCD = 1.0;
          this.atkTimer = 0;
          this.radius = 8;
          this.laneX = laneX;
          this.target = null;
        }

        update(dt) {
          if (!this.alive) return;
          this.atkTimer -= dt;

          this.target = this.findTarget();
          if (this.target && this.dist(this.target) <= this.atkRange) {
            if (this.atkTimer <= 0) {
              this.atkTimer = this.atkCD;
              this.target.takeDamage(this.atkDmg, this);
            }
          } else {
            // 沿兵线前进
            const dir = this.team === 'blue' ? -1 : 1;
            const targetY = this.target ? this.target.y : (this.team === 'blue' ? 60 : 620);
            const dx = this.laneX - this.x;
            const dy = targetY - this.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            this.x += (dx / len) * this.speed * dt;
            this.y += (dy / len) * this.speed * dt * 0.6 + dir * this.speed * dt * 0.4;
          }
          this.x = Math.max(10, Math.min(W - 10, this.x));
          this.y = Math.max(10, Math.min(H - 10, this.y));
        }

        findTarget() {
          const enemies = this.team === 'blue'
            ? [...heroes.filter(h => h.team === 'red' && h.alive), ...minions.filter(m => m.team === 'red' && m.alive), ...towers.filter(t => t.team === 'red' && t.alive), ...crystals.filter(c => c.team === 'red' && c.alive)]
            : [...heroes.filter(h => h.team === 'blue' && h.alive), ...minions.filter(m => m.team === 'blue' && m.alive), ...towers.filter(t => t.team === 'blue' && t.alive), ...crystals.filter(c => c.team === 'blue' && c.alive)];

          let best = null, bestDist = 300;
          for (const e of enemies) {
            const d = this.dist(e);
            if (d < bestDist) { best = e; bestDist = d; }
          }
          return best;
        }
      }

      class Tower extends Entity {
        constructor(x, y, team) {
          super(x, y, team, 5000, 5000);
          this.atkRange = 200;
          this.atkDmg = 350;
          this.atkCD = 1.5;
          this.atkTimer = 0;
          this.radius = 20;
        }

        update(dt) {
          if (!this.alive) return;
          this.atkTimer -= dt;
          if (this.atkTimer > 0) return;

          // 优先攻击小兵，然后英雄（英雄在塔下攻击友方英雄时优先）
          const enemies = this.team === 'blue'
            ? [...minions.filter(m => m.team === 'red' && m.alive), ...heroes.filter(h => h.team === 'red' && h.alive)]
            : [...minions.filter(m => m.team === 'blue' && m.alive), ...heroes.filter(h => h.team === 'blue' && h.alive)];

          for (const e of enemies) {
            if (this.dist(e) <= this.atkRange) {
              this.atkTimer = this.atkCD;
              e.takeDamage(this.atkDmg, this);
              if (!e.alive && e instanceof Hero) {
                const killer = this.team === 'blue' ? '蓝方防御塔' : '红方防御塔';
                addKillMsg(killer + ' 击败了 ' + e.name);
              }
              break;
            }
          }
        }
      }

      class Crystal extends Entity {
        constructor(x, y, team) {
          super(x, y, team, 10000, 10000);
          this.atkRange = 160;
          this.atkDmg = 250;
          this.atkCD = 1.0;
          this.atkTimer = 0;
          this.radius = 28;
        }

        update(dt) {
          if (!this.alive) {
            gameOver = true;
            winner = this.team === 'blue' ? '红方' : '蓝方';
            return;
          }
          this.atkTimer -= dt;
          if (this.atkTimer > 0) return;

          const enemies = this.team === 'blue'
            ? [...heroes.filter(h => h.team === 'red' && h.alive), ...minions.filter(m => m.team === 'red' && m.alive)]
            : [...heroes.filter(h => h.team === 'blue' && h.alive), ...minions.filter(m => m.team === 'blue' && m.alive)];

          for (const e of enemies) {
            if (this.dist(e) <= this.atkRange) {
              this.atkTimer = this.atkCD;
              e.takeDamage(this.atkDmg, this);
              break;
            }
          }
        }
      }

      // ==================== 特效 ====================
      class HitEffect {
        constructor(x, y) {
          this.x = x; this.y = y; this.life = 0.3;
        }
        update(dt) { this.life -= dt; }
        get alive() { return this.life > 0; }
      }

      class SkillEffect {
        constructor(x, y) {
          this.x = x; this.y = y; this.life = 0.5; this.maxLife = 0.5;
        }
        update(dt) { this.life -= dt; }
        get alive() { return this.life > 0; }
      }

      // ==================== 击杀消息 ====================
      function addKillMsg(msg) {
        const div = document.createElement('div');
        div.className = 'kill-msg';
        div.textContent = msg;
        document.getElementById('killFeed').appendChild(div);
        setTimeout(() => div.remove(), 3000);
      }

      // ==================== 初始化 ====================
      function initGame() {
        heroes = [];
        minions = [];
        towers = [];
        crystals = [];
        effects = [];
        gameOver = false;
        winner = null;
        gameTime = 0;
        minionSpawnTimer = 3;
        blueKills = 0;
        redKills = 0;

        // 蓝方英雄
        player = new Hero(400, 560, 'blue', true, '你');
        heroes.push(player);
        heroes.push(new Hero(220, 580, 'blue', false, '亚瑟'));
        heroes.push(new Hero(580, 580, 'blue', false, '后羿'));

        // 红方英雄
        heroes.push(new Hero(400, 120, 'red', false, '兰陵王'));
        heroes.push(new Hero(220, 100, 'red', false, '妲己'));
        heroes.push(new Hero(580, 100, 'red', false, '孙悟空'));

        // 防御塔
        for (const lane of LANES) {
          for (const t of lane.towers) {
            towers.push(new Tower(t.x, t.y, t.team));
          }
        }

        // 水晶
        crystals.push(new Crystal(400, 640, 'blue'));
        crystals.push(new Crystal(400, 40, 'red'));
      }

      // ==================== 小兵生成 ====================
      function spawnMinions() {
        for (const lane of LANES) {
          // 蓝方小兵
          minions.push(new Minion(lane.x, 620, 'blue', lane.x));
          // 红方小兵
          minions.push(new Minion(lane.x, 60, 'red', lane.x));
        }
      }

      // ==================== 绘图 ====================
      function drawMap() {
        // 背景
        ctx.fillStyle = '#1a472a';
        ctx.fillRect(0, 0, W, H);

        // 路径
        ctx.strokeStyle = '#2d6b3f';
        ctx.lineWidth = 60;
        for (const lane of LANES) {
          ctx.beginPath();
          ctx.moveTo(lane.x, 0);
          ctx.lineTo(lane.x, H);
          ctx.stroke();
        }

        // 路径边线
        ctx.strokeStyle = '#3a8b4f';
        ctx.lineWidth = 2;
        for (const lane of LANES) {
          ctx.beginPath();
          ctx.moveTo(lane.x - 32, 0);
          ctx.lineTo(lane.x - 32, H);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(lane.x + 32, 0);
          ctx.lineTo(lane.x + 32, H);
          ctx.stroke();
        }

        // 河道
        ctx.fillStyle = 'rgba(30, 80, 140, 0.4)';
        ctx.fillRect(0, RIVER_Y - 24, W, 48);
        ctx.strokeStyle = 'rgba(50, 120, 200, 0.6)';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, RIVER_Y - 24, W, 48);

        // 草丛装饰
        const bushes = [
          [160, 280], [640, 280], [160, 400], [640, 400],
          [300, 300], [500, 300], [300, 380], [500, 380]
        ];
        for (const [bx, by] of bushes) {
          ctx.fillStyle = 'rgba(10, 60, 10, 0.5)';
          ctx.beginPath();
          ctx.arc(bx, by, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0d3d0d';
          ctx.beginPath();
          ctx.arc(bx, by, 16, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawEntity(e) {
        if (!e.alive) return;

        if (e instanceof Hero) {
          // 英雄身体
          ctx.fillStyle = e.color;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = e.isPlayer ? '#fff' : '#000';
          ctx.lineWidth = e.isPlayer ? 3 : 1.5;
          ctx.stroke();

          // 名字
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px SimHei';
          ctx.textAlign = 'center';
          ctx.fillText(e.name, e.x, e.y - e.radius - 8);

          // 血条
          const bw = 40, bh = 4;
          ctx.fillStyle = '#333';
          ctx.fillRect(e.x - bw / 2, e.y - e.radius - 16, bw, bh);
          const hpRatio = e.hp / e.maxHp;
          ctx.fillStyle = e.team === 'blue' ? '#44cc44' : '#ff4444';
          ctx.fillRect(e.x - bw / 2, e.y - e.radius - 16, bw * hpRatio, bh);

          // 技能冷却指示器（仅玩家）
          if (e.isPlayer && e.skillCD > 0) {
            ctx.fillStyle = 'rgba(255,255,0,0.6)';
            ctx.font = '10px SimHei';
            ctx.fillText('K CD:' + e.skillCD.toFixed(1), e.x, e.y + e.radius + 16);
          }
        } else if (e instanceof Minion) {
          ctx.fillStyle = e.team === 'blue' ? '#6699cc' : '#cc6666';
          ctx.fillRect(e.x - 5, e.y - 5, 10, 10);
          const bw = 20, bh = 3;
          ctx.fillStyle = '#333';
          ctx.fillRect(e.x - bw / 2, e.y - 10, bw, bh);
          ctx.fillStyle = e.team === 'blue' ? '#44cc44' : '#ff4444';
          ctx.fillRect(e.x - bw / 2, e.y - 10, bw * (e.hp / e.maxHp), bh);
        } else if (e instanceof Tower) {
          // 塔
          ctx.fillStyle = e.team === 'blue' ? '#3355aa' : '#aa3333';
          ctx.fillRect(e.x - 18, e.y - 22, 36, 44);
          ctx.fillStyle = e.team === 'blue' ? '#4466cc' : '#cc4444';
          ctx.beginPath();
          ctx.arc(e.x, e.y - 24, 14, Math.PI, 0);
          ctx.fill();
          const bw = 50, bh = 5;
          ctx.fillStyle = '#333';
          ctx.fillRect(e.x - bw / 2, e.y - 34, bw, bh);
          ctx.fillStyle = e.team === 'blue' ? '#44cc44' : '#ff4444';
          ctx.fillRect(e.x - bw / 2, e.y - 34, bw * (e.hp / e.maxHp), bh);
        } else if (e instanceof Crystal) {
          // 水晶
          const grad = ctx.createRadialGradient(e.x, e.y, 5, e.x, e.y, e.radius);
          grad.addColorStop(0, e.team === 'blue' ? '#88ccff' : '#ff8888');
          grad.addColorStop(1, e.team === 'blue' ? '#2255aa' : '#aa2222');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = e.team === 'blue' ? '#aaddff' : '#ffaaaa';
          ctx.lineWidth = 2;
          ctx.stroke();

          const bw = 60, bh = 6;
          ctx.fillStyle = '#333';
          ctx.fillRect(e.x - bw / 2, e.y - e.radius - 14, bw, bh);
          ctx.fillStyle = e.team === 'blue' ? '#44cc44' : '#ff4444';
          ctx.fillRect(e.x - bw / 2, e.y - e.radius - 14, bw * (e.hp / e.maxHp), bh);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px SimHei';
          ctx.textAlign = 'center';
          ctx.fillText(e.team === 'blue' ? '蓝方水晶' : '红方水晶', e.x, e.y - e.radius - 20);
        }
      }

      function drawEffects() {
        for (const ef of effects) {
          if (ef instanceof HitEffect) {
            ctx.fillStyle = `rgba(255,200,50,${ef.life / 0.3})`;
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, 10, 0, Math.PI * 2);
            ctx.fill();
          } else if (ef instanceof SkillEffect) {
            const ratio = ef.life / ef.maxLife;
            ctx.strokeStyle = `rgba(255,220,50,${ratio})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, 120 * (1 - ratio), 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function drawHUD() {
        // 顶部信息栏
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, 30);
        ctx.fillStyle = '#4499ff';
        ctx.font = 'bold 13px SimHei';
        ctx.textAlign = 'left';
        ctx.fillText('蓝方 击杀:' + blueKills + ' | 水晶: ' + Math.max(0, crystals[0].hp), 10, 20);
        ctx.fillStyle = '#ff4444';
        ctx.textAlign = 'right';
        ctx.fillText('红方 击杀:' + redKills + ' | 水晶: ' + Math.max(0, crystals[1].hp), W - 10, 20);

        // 操作提示
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '10px SimHei';
        ctx.textAlign = 'center';
        ctx.fillText('WASD移动 | J/空格 普攻 | K 技能(AOE)', W / 2, H - 6);
      }

      function drawGameOver() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = winner === '蓝方' ? '#4499ff' : '#ff4444';
        ctx.font = 'bold 48px SimHei';
        ctx.textAlign = 'center';
        ctx.fillText(winner + '胜利！', W / 2, H / 2 - 20);
        ctx.fillStyle = '#f0d78c';
        ctx.font = '18px SimHei';
        ctx.fillText('按 R 重新开始', W / 2, H / 2 + 30);
      }

      // ==================== 主循环 ====================
      function update(dt) {
        if (gameOver) {
          if (keys['r']) initGame();
          return;
        }

        gameTime += dt;
        minionSpawnTimer -= dt;

        // 清理
        heroes = heroes.filter(h => h.alive || h.respawnTimer > 0);
        minions = minions.filter(m => m.alive);
        towers = towers.filter(t => t.alive);
        crystals = crystals.filter(c => c.alive);
        effects = effects.filter(e => e.alive);

        // 更新
        for (const h of heroes) h.update(dt);
        for (const m of minions) m.update(dt);
        for (const t of towers) t.update(dt);
        for (const c of crystals) c.update(dt);
        for (const e of effects) e.update(dt);

        // 生成小兵
        if (minionSpawnTimer <= 0 && !gameOver) {
          spawnMinions();
          minionSpawnTimer = MINION_SPAWN_INTERVAL;
        }

        // 检查水晶
        if (crystals.length < 2) {
          gameOver = true;
          winner = crystals[0] && crystals[0].team === 'blue' ? '蓝方' : '红方';
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        drawMap();

        // 按 Y 轴排序绘制（远处的先画）
        const allEntities = [...towers, ...crystals, ...minions, ...heroes]
          .filter(e => e.alive)
          .sort((a, b) => a.y - b.y);

        for (const e of allEntities) drawEntity(e);
        drawEffects();
        drawHUD();
        if (gameOver) drawGameOver();
      }

      let lastTime = performance.now();
      function gameLoop(now) {
        let dt = (now - lastTime) / 1000;
        if (dt > 0.1) dt = 0.1; // cap delta
        lastTime = now;

        update(dt);
        draw();
        requestAnimationFrame(gameLoop);
      }

      // ==================== 启动 ====================
      initGame();
      addKillMsg('敌军还有5秒到达战场！');
      addKillMsg('WASD移动 | J/空格普攻 | K技能');
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
</html>
